<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="practice.css">
</head>

<body>
    <div class="library">
        <div class="library-header">
            <h2 class="heading">Your Library</h2>
            <button class="create-btn">+ Create</button>
        </div>
        <div class="filter-btn">
            <button class="create-btn">Playlists</button>
            <button class="create-btn">Artists</button>
        </div>
        <div class="library-tools">
            <button class="search-library" type="button" aria-label="Search your library">⌕</button>
            <button class="recents-button" type="button">Recents <span>☷</span></button>
        </div>
        <div class="library-list">
            <button class="library-item">
                <img class="cover artist-cover" src="https://picsum.photos/seed/sleep-token/120" alt="Sleep Token">
                <span class="item-info">Liked Songs<span class="pin">◆</span> Playlist • Hornet</span>
            </button>
            <button class="library-item">
                <img class="cover artist-cover" src="https://picsum.photos/seed/sleep-token/120" alt="Sleep Token">
                <span class="item-info">Liked Songs<span class="pin">◆</span> Playlist • Hornet</span>
            </button>
            <button class="library-item">
                <img class="cover artist-cover" src="https://picsum.photos/seed/sleep-token/120" alt="Sleep Token">
                <span class="item-info">Liked Songs<span class="pin">◆</span> Playlist • Hornet</span>
            </button>
            <button class="library-item" type="button">
                <img class="cover" src="https://picsum.photos/seed/epic-edm/120" alt="Epic EDM">
                <span class="item-info"><strong>Epic EDM</strong><small>Playlist • Hornet</small></span>
            </button>
            <button class="library-item" type="button">
                <img class="cover" src="https://picsum.photos/seed/epic-edm/120" alt="Epic EDM">
                <span class="item-info"><strong>Epic EDM</strong><small>Playlist • Hornet</small></span>
            </button>
            <button class="library-item" type="button">
                <img class="cover" src="https://picsum.photos/seed/epic-edm/120" alt="Epic EDM">
                <span class="item-info"><strong>Epic EDM</strong><small>Playlist • Hornet</small></span>
            </button>
        </div>
    </div>
</body>

</html>
