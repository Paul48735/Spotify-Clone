<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="practice.css">
</head>

<body>
    <main class="app-layout">

        <aside class="library">
            <div class="library-header">
                <h2 class="heading">Your Library</h2>
                <button class="create-button">+ Create</button>
            </div>
            <div class="filter-button">
                <button class="create-button">Playlists</button>
                <button class="create-button">Artists</button>
            </div>
            <div class="library-scroll">
                <div class="library-tools">
                    <button class="search-library" type="button" aria-label="Search your library">⌕</button>
                    <button class="recents-button" type="button">Recents <span>☷</span></button>
                </div>
                <div class="library-list">
                    <button class="library-item">
                        <img class="cover" src="https://picsum.photos/seed/liked-songs/120" alt="Liked Songs">
                        <span class="item-info">
                            <span class="item-title">Liked Songs</span>
                            <span class="item-detail">Playlist • Hornet</span>
                        </span>
                    </button>
                    <button class="library-item">
                        <img class="cover artist-cover" src="https://picsum.photos/seed/blacklit/120"
                            alt="Blacklit Canopy Official">
                        <span class="item-info">
                            <span class="item-title">Blacklit Canopy Official</span>
                            <span class="item-detail">Artist</span>
                        </span>
                    </button>
                    <button class="library-item">
                        <img class="cover artist-cover" src="https://picsum.photos/seed/sleep-token/120"
                            alt="Sleep Token">
                        <span class="item-info">
                            <span class="item-title">Sleep Token</span>
                            <span class="item-detail">Artist</span>
                        </span>
                    </button>
                    <button class="library-item">
                        <img class="cover artist-cover" src="https://picsum.photos/seed/bring-me-the-horizon/120"
                            alt="Bring Me The Horizon">
                        <span class="item-info">
                            <span class="item-title">Bring Me The Horizon</span>
                            <span class="item-detail">Artist</span>
                        </span>
                    </button>
                    <button class="library-item">
                        <img class="cover artist-cover" src="https://picsum.photos/seed/bad-omens/120" alt="Bad Omens">
                        <span class="item-info">
                            <span class="item-title">Bad Omens</span>
                            <span class="item-detail">Artist</span>
                        </span>
                    </button>
                    <button class="library-item">
                        <img class="cover artist-cover" src="https://picsum.photos/seed/architects/120"
                            alt="Architects">
                        <span class="item-info">
                            <span class="item-title">Architects</span>
                            <span class="item-detail">Artist</span>
                        </span>
                    </button>
                    <button class="library-item">
                        <img class="cover artist-cover" src="https://picsum.photos/seed/spiritbox/120" alt="Spiritbox">
                        <span class="item-info">
                            <span class="item-title">Spiritbox</span>
                            <span class="item-detail">Artist</span>
                        </span>
                    </button>
                </div>
            </div>
        </aside>

        <section class="home">
            <div class="content-filters">
                <button class="content-button">All</button>
                <button class="content-button">Music</button>
                <button class="content-button">Podcasts</button>
            </div>
            <div class="quick-play">
                <button class="quick-card">
                    <img class="" src="https://picsum.photos/seed/indie-rock/100" alt="Indie Rock Mix">
                    <span>Indie Rock Mix</span>
                </button>
                <button class="quick-card">
                    <img class="" src="https://picsum.photos/seed/sleep-mix/100" alt="Sleep Token Mix">
                    <span>Sleep Token Mix</span>
                </button>
                <button class="quick-card">
                    <img class="" src="https://picsum.photos/seed/dayseeker/100" alt="Dayseeker Mix">
                    <span>Dayseeker Mix</span>
                </button>
                <button class="quick-card">
                    <img class="" src="https://picsum.photos/seed/foo-fighters/100" alt="Foo Fighters Mix">
                    <span>Foo Fighters Mix</span>
                </button>
                <button class="quick-card">
                    <img class="" src="https://picsum.photos/seed/mgk/100" alt="MGK Mix">
                    <span>MGK Mix</span>
                </button>
                <button class="quick-card">
                    <img class="" src="https://picsum.photos/seed/daily-mix/100" alt="Daily Mix 4">
                    <span>Daily Mix 4</span>
                </button>
                <button class="quick-card">
                    <img class="" src="https://picsum.photos/seed/sleep-token/100" alt="Sleep Token">
                    <span>Sleep Token</span>
                </button>
                <button class="quick-card">
                    <img class="" src="https://picsum.photos/seed/staind/100" alt="Staind Mix">
                    <span>Staind Mix</span>
                </button>
            </div>
            <div class="section-heading">
                <h1>Pre-save upcoming releases</h1>
                <button type="button">Show all</button>
            </div>
            <div class="upcoming-release">
                <button class="upcoming-card">
                    <img src="https://picsum.photos/seed/party-over/350" alt="Party's Over">
                    <span>PARTY'S OVER</span>
                    <span class="artist-name">Sueco</span>
                </button>
                <button class="upcoming-card">
                    <img src="https://picsum.photos/seed/under-sun/350" alt="Everything Under The Sun">
                    <span>Everything Under The Sun</span>
                    <span class="artist-name">Nickelback</span>
                </button>
                <button class="upcoming-card">
                    <img src="https://picsum.photos/seed/after-storm/350" alt="After The Storm">
                    <span>After The Storm</span>
                    <span class="artist-name">Skillet</span>
                </button>
                <button class="upcoming-card">
                    <img src="https://picsum.photos/seed/unshatter/350" alt="Unshatter Film Soundtrack">
                    <span>Unshatter Film Soundtrack</span>
                    <span class="artist-name">Linkin Park</span>
                </button>
            </div>
        </section>

        <aside class="now-playing">
            <div class="now-playing-card">
                <img src="https://i.scdn.co/image/ab67616d00001e02882265cd9bdded9ea9a153b9" alt="Sleep Token">
                <h2 class="now-playing-text">Sleep Token Mix</h2>
                <div class="song-overlay">
                    <div class="song-info">
                        <h3 class="now-playing-song">Caramel</h3>
                        <p class="now-playing-artist">Sleep Token</p>
                    </div>
                    <div class="now-playing-action">
                        <button type="button" aria-label="Add to library">+</button>
                    </div>
                </div>
            </div>
            <div class="about-the-artist">
                <div class="artist-card">
                    <img src="https://i.scdn.co/image/ab6761610000e5ebd00c2ff422829437e6b5f1e0" alt="">
                    <h2>About the artist</h2>
                    <div class="artist-info">
                        <h3>Sleep Token</h3>
                        <div class="artist-stats">
                            <p>5,030,836 monthly listeners</p>
                            <button class="follow-button">Follow</button>
                        </div>
                        <p class="artist-description">Even in Arcadia</p>
                    </div>
                </div>
            </div>
            <div class="credits">

            </div>
        </aside>

        <div class="player">

        </div>
    </main>
</body>

</html>
